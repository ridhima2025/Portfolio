<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridhima Kaintura | CSE (Data Science)</title>
    <!-- FontAwesome for comfy, clean logos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Color Palette & Variables */
        :root {
            --bg-color: #faf9f6; /* Soft off-white/cream */
            --text-main: #2c2c2c;
            --text-muted: #6b6b6b;
            --btn-bg: #ffffff;
            --btn-border: #eaeaea;
            --btn-hover: #f3f3f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 4rem 1.5rem;
        }

        /* Constrain width for the Linktree look */
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.2rem;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }

        .name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            padding: 0 1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--btn-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 1rem 1.5rem;
            border-radius: 50px; /* Gives the soft, comfy pill shape */
            font-size: 1rem;
            font-weight: 500;
            border: 1px solid var(--btn-border);
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
        }

        .link-btn i {
            font-size: 1.25rem;
            color: var(--text-muted);
            transition: color 0.25s ease;
        }

        .link-btn:hover i {
            color: var(--text-main);
        }

        /* Simple state for the JS fade-in */
        .fade-in {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <img class="profile-pic" src="978829300266990415.jpg" alt="Profile picture">
        
        <h1 class="name">Ridhima Kaintura</h1>
        <p class="bio">CSE (Data Science) Undergraduate @ GGSIPU🎓<br>Exploring technology, building things, and learning along the way.</p>
        
        <div class="links">
            <a href="https://github.com/ridhima2025" target="_blank" class="link-btn">
                <i class="fab fa-github"></i> GitHub
            </a>
<a href="https://www.linkedin.com/in/ridhima-kaintura-a556a2432" target="_blank" class="link-btn">                <i class="fab fa-linkedin"></i> LinkedIn
            </a>
        </div>
    </div>

    <script>
        // Subtle fade-in animation when the page loads
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.querySelector('.fade-in');
            
            // Add a slight delay before triggering the animation 
            // for a smoother, premium feel.
            setTimeout(() => {
                container.classList.add('visible');
            }, 150);
        });
    </script>
</body>
</html>
